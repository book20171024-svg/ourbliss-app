<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Our Bliss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #F7F3ED; /* Warm Beige */
        color: #3A3A3A;
        /* Prevent pull-to-refresh and rubber banding */
        overscroll-behavior: none;
        overflow: hidden;
        height: 100%;
        position: fixed;
        width: 100%;
      }
      #root {
        height: 100%;
        overflow: hidden;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Soft Gold Gradient Text */
      .text-gold-gradient {
        background: linear-gradient(135deg, #D9B26D 0%, #E8C88B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      /* Soft shadow for floating elements */
      .soft-shadow {
        box-shadow: 0 4px 20px -2px rgba(217, 178, 109, 0.2);
      }
      /* Animations */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes scale-in {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scale-in 0.2s ease-out forwards;
      }
    </style>
